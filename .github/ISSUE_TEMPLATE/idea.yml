name: Question or feature proposal
description: Ask a question or propose a focused improvement.
title: "idea: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the workflow before suggesting a solution. Documentation and non-code ideas are welcome.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach or question
      description: Include an example with invented data and note any storage/privacy implications.
    validations:
      required: true
  - type: dropdown
    id: participation
    attributes:
      label: Would you like to help?
      options:
        - "I can discuss or test"
        - "I would like to implement this"
        - "I am reporting a need"
